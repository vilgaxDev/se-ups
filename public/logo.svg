<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="128" fill="#146B50"/>
  
  <!-- Subtle Inner Contour -->
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="#19865F" stroke-width="8" stroke-opacity="0.4"/>
  
  <!-- Stylized ID Card Emblem -->
  <rect x="100" y="140" width="312" height="232" rx="28" fill="#FFFFFF" fill-opacity="0.96"/>
  <rect x="100" y="140" width="312" height="232" rx="28" stroke="#D6F36A" stroke-width="6"/>

  <!-- Card Chip / Badge Header -->
  <rect x="136" y="176" width="64" height="74" rx="12" fill="#E8F4ED"/>
  <!-- User Silhouette in Chip -->
  <circle cx="168" cy="202" r="16" fill="#146B50"/>
  <path d="M148 240 C148 226 188 226 188 240" stroke="#146B50" stroke-width="6" stroke-linecap="round"/>

  <!-- Card Lines (Identity text representation) -->
  <rect x="224" y="180" width="144" height="14" rx="7" fill="#123C30"/>
  <rect x="224" y="206" width="112" height="10" rx="5" fill="#627168"/>
  <rect x="224" y="228" width="80" height="10" rx="5" fill="#89968E"/>

  <!-- Kenyan Flag Accent Strip (Restrained, subtle) -->
  <rect x="136" y="278" width="240" height="6" rx="3" fill="#123C30"/>
  <rect x="136" y="294" width="160" height="12" rx="6" fill="#E8F4ED"/>
  <rect x="136" y="316" width="200" height="10" rx="5" fill="#E3EAE4"/>

  <!-- Restrained Electric Lime Verification Badge -->
  <circle cx="376" cy="340" r="46" fill="#D6F36A" stroke="#123C30" stroke-width="6"/>
  <!-- Checkmark icon -->
  <path d="M360 340 L372 352 L394 330" stroke="#123C30" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
